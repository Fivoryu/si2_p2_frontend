<div class="auth-page">
  <div class="auth-page__bg" aria-hidden="true"></div>

  <a routerLink="/login" class="auth-page__back">
    <span class="material-icons" aria-hidden="true">arrow_back</span>
    Volver al inicio de sesión
  </a>

  <main class="auth-page__main">
    <section class="auth-card" aria-labelledby="reset-title">
      <header class="auth-card__header">
        <h1 id="reset-title">Restablecer contraseña</h1>
        <p>Ingrese el token recibido por correo y su nueva contraseña.</p>
      </header>

      <form class="auth-card__form" [formGroup]="form" (ngSubmit)="submit()">
        <ui-form-field
          label="Token de restablecimiento"
          [required]="true"
          helper="Pegue el token del enlace enviado a su correo"
        >
          <ui-input
            formControlName="token"
            placeholder="Token UUID"
            autocomplete="off"
            [invalid]="invalid('token')"
          />
        </ui-form-field>

        <ui-form-field label="Nueva contraseña" [required]="true">
          <ui-input
            formControlName="password"
            type="password"
            placeholder="Mínimo 8 caracteres"
            autocomplete="new-password"
            [invalid]="invalid('password')"
          />
        </ui-form-field>

        <ui-form-field label="Confirmar contraseña" [required]="true">
          <ui-input
            formControlName="password2"
            type="password"
            autocomplete="new-password"
            [invalid]="invalid('password2')"
          />
        </ui-form-field>

        <ui-button type="submit" variant="primary" [block]="true" [loading]="loading()">
          Actualizar contraseña
        </ui-button>
      </form>

      <footer class="auth-card__footer">
        <a routerLink="/recuperar-contrasena">Solicitar nuevo enlace</a>
      </footer>
    </section>
  </main>
</div>
