<div class="login-page">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>Emergencias — Acceso taller</mat-card-title>
      <mat-card-subtitle>Inicie sesión con su cuenta</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="username" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
        </mat-form-field>
        <button mat-flat-button color="primary" type="submit" class="full-width" [disabled]="loading || form.invalid">
          @if (loading) {
            <mat-spinner diameter="20" />
          } @else {
            Ingresar
          }
        </button>
      </form>
      <div class="demo-section">
        <p class="demo-title">Cuentas demo:</p>
        @for (d of demos; track d.email) {
          <button mat-stroked-button type="button" class="demo-btn" (click)="fillDemo(d.email, d.password)">
            {{ d.label }}
          </button>
        }
      </div>
    </mat-card-content>
  </mat-card>
</div>
