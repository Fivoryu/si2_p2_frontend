@if (showShell()) {

  <div class="app-shell">

    <aside class="app-sidebar">

      <div class="app-sidebar__brand">

        <mat-icon class="app-sidebar__logo">car_repair</mat-icon>

        <div class="app-sidebar__brand-text">

          <span class="app-sidebar__title">Emergencias</span>

          <span class="app-sidebar__tagline">Panel operativo</span>

        </div>

      </div>



      <nav class="app-sidebar__nav" aria-label="Navegación principal">

        @for (item of visibleNav(); track item.path) {

          <a

            class="app-sidebar__link"

            [routerLink]="item.path"

            routerLinkActive="app-sidebar__link--active"

          >

            <mat-icon>{{ item.icon }}</mat-icon>

            <span>{{ item.label }}</span>

          </a>

        }

      </nav>



      <div class="app-sidebar__footer">

        <button type="button" class="app-sidebar__logout" (click)="logout()">

          <mat-icon>logout</mat-icon>

          <span>Cerrar sesión</span>

        </button>

      </div>

    </aside>



    <div class="app-main">

      <header class="app-topbar">

        <h1 class="app-topbar__title">{{ pageTitle() }}</h1>

        <span class="app-topbar__badge">{{ roleLabel() }}</span>

      </header>

      <main class="app-content">

        <router-outlet />

      </main>

    </div>

  </div>

} @else {

  <router-outlet />

}
